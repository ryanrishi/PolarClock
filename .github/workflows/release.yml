name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build
        run: xcodebuild -scheme PolarClock -configuration Release build

      - name: Package screen saver
        run: |
          DERIVED_DATA=$(xcodebuild -scheme PolarClock -configuration Release -showBuildSettings | grep -m 1 "BUILT_PRODUCTS_DIR" | awk '{print $3}')
          cp -R "$DERIVED_DATA/PolarClock.saver" ./PolarClock.saver
          zip -r PolarClock.saver.zip PolarClock.saver

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: PolarClock.saver.zip
          generate_release_notes: true

      - name: Configure git identity
        uses: Homebrew/actions/git-user-config@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1

      # TAP_TOKEN needs contents:write and pull-requests:write on ryanrishi/homebrew-tap.
      # The default GITHUB_TOKEN cannot write to another repository.
      - name: Bump the Homebrew cask
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          brew tap ryanrishi/tap
          brew bump-cask-pr ryanrishi/tap/polarclock \
            --version="${GITHUB_REF_NAME#v}" \
            --sha256="$(shasum -a 256 PolarClock.saver.zip | cut -d ' ' -f 1)" \
            --no-fork
